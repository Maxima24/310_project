# Brings up the whole system: Postgres, the hub, and three simulated agents.
#
#   docker compose up --build
#
# Then arm it and watch alerts fire — see the README "Verify it end to end".
# Values come from the root .env (copy .env.example).

name: cpe310-security

x-agent-common: &agent-common
  build:
    context: ./agents
    dockerfile: Dockerfile
  image: cpe310-agent:latest
  restart: unless-stopped
  environment:
    # Agents get the enrollment secret only. Each is issued its own token on first
    # run and can then act solely as itself — it never sees OPERATOR_KEY.
    AGENT_BOOTSTRAP_KEY: ${AGENT_BOOTSTRAP_KEY:-dev-bootstrap-key-change-me}
    HUB_URL: http://hub:3000
    AGENT_TOKEN_DIR: /home/agent/.cpe310
  depends_on:
    hub:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-security}
    # Published so the hub can also be run natively against this database.
    # Defaults to 5433, not 5432: a locally-installed Postgres commonly owns 5432,
    # and binding over it silently sends migrations to the wrong server.
    # Containers reach it as `postgres:5432` regardless of this mapping.
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # The hub waits on this rather than on "container started" — Postgres accepts
    # TCP connections seconds before it can actually serve queries, and the hub's
    # migration step would fail against a half-started database.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-security}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  hub:
    build:
      # Root context: the hub depends on packages/contracts via `workspace:*`.
      context: .
      dockerfile: ./hub/Dockerfile
    image: cpe310-hub:latest
    restart: unless-stopped
    ports:
      - '${HUB_PORT:-3000}:3000'
    environment:
      # This stack is a local demo harness, so it defaults to `development` and
      # the sample key works out of the box. The hub REFUSES to start when
      # NODE_ENV=production while AGENT_API_KEY is still `dev-key-change-me` — so
      # a real deployment must set both together:
      #   NODE_ENV=production AGENT_API_KEY=<a real secret> docker compose up
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      AGENT_BOOTSTRAP_KEY: ${AGENT_BOOTSTRAP_KEY:-dev-bootstrap-key-change-me}
      OPERATOR_KEY: ${OPERATOR_KEY:-dev-operator-key-change-me}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-security}?schema=public
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-10000}
      HEARTBEAT_TIMEOUT_MS: ${HEARTBEAT_TIMEOUT_MS:-30000}
      ALERT_COOLDOWN_MS: ${ALERT_COOLDOWN_MS:-60000}
      CORS_ORIGIN: '*'
      # Notification fan-out. Mailpit accepts anything, so email works out of the box;
      # point SMTP_HOST at a real provider and set credentials for production.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-security-team@example.test}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-security-hub@example.test}
      # Unset by default — the webhook channel stays inert until a URL is given.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
      # Enables MQTT ingestion alongside REST. Unset it for HTTP-only.
      MQTT_URL: ${MQTT_URL:-mqtt://mosquitto:1883}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      mosquitto:
        condition: service_started

  # MQTT broker (roadmap item 4). The hub subscribes alongside its REST ingestion, so
  # both transports are live; agents choose with --transport.
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - '${MQTT_PORT:-1883}:1883'
    # Anonymous access is fine for a local demo bus. On a real network this wants
    # per-agent broker credentials plus topic ACLs, and TLS — the hub already verifies
    # the agent token in each payload, but that is authentication, not confidentiality.
    command: >
      sh -c "printf 'listener 1883\nallow_anonymous true\npersistence false\n' > /mosquitto/config/mosquitto.conf
      && exec mosquitto -c /mosquitto/config/mosquitto.conf"
    healthcheck:
      test: ['CMD-SHELL', 'mosquitto_sub -t healthcheck -C 1 -W 2 -h 127.0.0.1 || true']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # SMTP sink for notification fan-out (roadmap item 3). Captures every alert email
  # so the whole path is verifiable locally instead of needing a real mail provider.
  # Web inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Object store for video evidence (roadmap item 5). S3-compatible, so switching to
  # real S3 is an endpoint and credentials change, not a code change.
  # Console at http://localhost:9001 (minioadmin / minioadmin).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Simulated collector agents ------------------------------------------
  # All three share one image; only the arguments differ.

  agent-motion:
    <<: *agent-common
    command: ['--type', 'motion', '--id', 'motion-hallway', '--location', 'Hallway']

  # Runs over MQTT rather than HTTP, so `docker compose up` exercises both transports
  # at once and proves the Transport abstraction was worth having.
  agent-door:
    <<: *agent-common
    command:
      - '--type'
      - 'door'
      - '--id'
      - 'door-front'
      - '--location'
      - 'Front door'
      - '--transport'
      - 'mqtt'
      - '--mqtt-host'
      - 'mosquitto'

  # Simulation only. `--real --source 0` cannot work here: Docker Desktop on
  # Windows and macOS has no USB/webcam passthrough. To test a real camera, run
  # the agent natively against this containerized hub — see the README.
  agent-camera:
    <<: *agent-common
    command: ['--type', 'camera', '--id', 'camera-lobby', '--location', 'Lobby']

volumes:
  postgres-data:
  minio-data:
